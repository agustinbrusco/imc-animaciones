<script>
/* Fourier como álgebra lineal: la clase del 22/09 (el pizarrón de Excalidraw), con cada dibujo tocable.
   Colores: azul = el vector o la función f, verde = la base, naranja = los coeficientes, violeta = lo que da negativo
   o lo que falla (base no ortogonal). */

/* ── herramientas de esta clase ──────────────────────────────────────────── */
const PI = Math.PI;
const linspace = (a, b, n) => Array.from({ length: n }, (_, i) => a + (b - a) * i / (n - 1));
function integral(h, a = -PI, b = PI, n = 4000) {   // punto medio
  const dx = (b - a) / n; let s = 0;
  for (let i = 0; i < n; i++) s += h(a + (i + .5) * dx);
  return s * dx;
}
const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
const XS = linspace(-PI, PI, 1201);
const TICKS_PI = [[-PI, '-\\pi'], [-PI / 2, '-\\tfrac{\\pi}{2}'], [PI / 2, '\\tfrac{\\pi}{2}'], [PI, '\\pi']];
const ejePi = (x0, x1, y0, y1, yr, o = {}) => ({ x0, x1, y0, y1, xr: [-PI, PI], yr, ejeY: 0, base: 0, xticks: TICKS_PI, xlabel: 'x', ...o });

// Flecha de p0 a p1 (en píxeles), estirada hasta prog; si es muy corta no se dibuja.
function poner(fl, p0, p1, prog = 1) {
  Object.assign(fl, { x1: p0[0], y1: p0[1], x2: p1[0], y2: p1[1] });
  if (Math.hypot(p1[0] - p0[0], p1[1] - p0[1]) < 4) return fl.alpha(0);
  return fl.grow(prog);
}
// Área entre una curva y una recta horizontal (base), con la parte de arriba y la de abajo en dos colores.
class Area extends M {
  constructor(parent, o = {}) {
    super(parent);
    this.pos = E('path', {}, this.g); this.neg = E('path', {}, this.g);
    Object.assign(this.pos.style, { fill: C(o.pos || 'x'), fillOpacity: .22 });
    Object.assign(this.neg.style, { fill: C(o.neg || 'ruido'), fillOpacity: .22 });
  }
  set(ax, xs, ys, base = 0) {
    if (xs.length < 2) { this.pos.setAttribute('d', 'M0,0'); this.neg.setAttribute('d', 'M0,0'); return this; }
    const yb = ax.Y(base);
    const poli = s => {
      const pts = xs.map((x, i) => [ax.X(x), ax.Y(s > 0 ? Math.max(ys[i], base) : Math.min(ys[i], base))]);
      return pathD([[pts[0][0], yb], ...pts, [pts.at(-1)[0], yb]]) + 'Z';
    };
    this.pos.setAttribute('d', poli(1)); this.neg.setAttribute('d', poli(-1));
    return this;
  }
}
// Pista para quien mira la clase por su cuenta: qué se puede tocar.
const pista = (g, s, x, y, o = {}) => new Mix(g, s, { size: 26, x, y, italic: true, color: 'dim', anchor: 'middle', ...o });

// Las funciones de los ejemplos, con sus coeficientes de Fourier calculados numéricamente.
const NMAX = 40;
const FUN = {
  f: { pill: '$f$ del 1.c', tex: 'f', par: true, yr: [-.5, 1.45], h: x => Math.abs(x) >= PI / 2 ? 1 : 0 },
  f2: { pill: '$f_2$ del 1.c', tex: 'f_2', par: false, yr: [-1.15, 1.15], h: x => x <= -PI / 2 ? (x + PI) / 2 : x <= PI / 2 ? -x / 2 : (x - PI) / 2 },
  x: { pill: 'diente de sierra', tex: 'x', par: false, yr: [-4.2, 4.2], h: x => x },
};
for (const F of Object.values(FUN)) {
  F.a = Array.from({ length: NMAX + 1 }, (_, n) => integral(x => F.h(x) * Math.cos(n * x)) / ((n ? 1 : 2) * PI));
  F.b = Array.from({ length: NMAX + 1 }, (_, n) => n ? integral(x => F.h(x) * Math.sin(n * x)) / PI : 0);
  F.ys = XS.map(F.h);
  F.max = Math.max(...F.ys.map(Math.abs));
}
// Suma parcial con los términos n que pasan el filtro (el término 0 es a_0)
function suma(F, usar, xs = XS) {
  return xs.map(x => {
    let s = usar(0) ? F.a[0] : 0;
    for (let n = 1; n <= NMAX; n++) if (usar(n)) s += F.a[n] * Math.cos(n * x) + F.b[n] * Math.sin(n * x);
    return s;
  });
}

/* ════════════════════════════════════════════════════════════════════════════
   1  Título
   ════════════════════════════════════════════════════════════════════════════ */
slide('titulo', g => {
  const t1 = new Txt(g, 'Series de Fourier', { size: 86, anchor: 'middle', x: 960, y: 410 });
  const t2 = new Mix(g, 'como álgebra lineal para funciones', { size: 48, anchor: 'middle', x: 960, y: 495, italic: true, color: 'dim' });
  // la f₂ del 1.c, con cinco términos de su serie
  const us = linspace(0, 1, 700), F = FUN.f2;
  const y = u => { const x = -2 * PI + 4 * PI * u; let s = 0; for (let n = 1; n <= 9; n += 2) s += F.b[n] * Math.sin(n * x); return s; };
  const onda = new Curve(g, us.map(u => [260 + 1400 * u, 720 - 120 * y(u)]), { color: 'x', width: 5 });
  const pie = new Txt(g, 'Introducción al Modelado Continuo  ·  2C 2026', { size: 30, anchor: 'middle', x: 960, y: 990, color: 'dim' });
  return {
    steps: [2.6],
    render(t) { t1.write(P(t, 0, 1.4)); t2.write(P(t, .8, 1.1)); onda.create(P(t, 1.1, 1.5)); pie.write(P(t, 1.6, .8)); },
  };
});

/* ════════════════════════════════════════════════════════════════════════════
   2  En ℝ²: los coeficientes en una base ortogonal son productos internos.
      Se arrastran f, u y v; con "cualquier base" la suma de proyecciones deja de dar f.
   ════════════════════════════════════════════════════════════════════════════ */
slide('r2', g => {
  const titulo = new Mix(g, 'En $\\mathbb R^2$', { size: 54, x: 70, y: 80 });
  const O = [420, 690], S = 125;
  const W = ([x, y]) => [O[0] + S * x, O[1] - S * y], mundo = q => [(q.x - O[0]) / S, (O[1] - q.y) / S];
  const lim = ([x, y]) => [clamp(x, -1.7, 4.4), clamp(y, -1.6, 3.9)];
  const ax = new Axes(g, { x0: 170, x1: 1000, y0: 180, y1: 920, xr: [-2, 4.64], yr: [-1.84, 4.08], ejeY: 0, base: 0 });
  const cp = E('clipPath', { id: 'clipR2' }, g); E('rect', { x: 150, y: 160, width: 880, height: 780 }, cp);
  const rectaU = new Curve(g, null, { color: 'tenue', width: 2, clip: 'clipR2' }), rectaV = new Curve(g, null, { color: 'tenue', width: 2, clip: 'clipR2' });
  const guia = (col = 'dim') => new Curve(g, null, { color: col, width: 2.5, dash: '7 9' });
  const gA = guia(), gB = guia(), gC = guia(), gD = guia(), gS1 = guia('ruido'), gS2 = guia('ruido');
  const e1 = new Arrow(g, ...W([0, 0]), ...W([1, 0]), { color: 'fg', width: 4, head: 18 });
  const e2 = new Arrow(g, ...W([0, 0]), ...W([0, 1]), { color: 'fg', width: 4, head: 18 });
  const le1 = new Tex(g, '\\hat e_1', { size: 36, x: W([1, 0])[0] - 10, y: O[1] + 46, anchor: 'middle' });
  const le2 = new Tex(g, '\\hat e_2', { size: 36, x: O[0] - 18, y: W([0, 1])[1] + 14, anchor: 'end' });
  const aS = new Arrow(g, 0, 0, 1, 1, { color: 'ruido', width: 4, dash: '12 8' });
  const aU = new Arrow(g, 0, 0, 1, 1, { color: 'h', width: 4.5 }), aV = new Arrow(g, 0, 0, 1, 1, { color: 'h', width: 4.5 });
  const aF = new Arrow(g, 0, 0, 1, 1, { color: 'x', width: 5.5, head: 26 });
  const lF = new Tex(g, '\\vec f', { size: 44, color: 'x' }), lU = new Tex(g, '\\vec u', { size: 40, color: 'h' }), lV = new Tex(g, '\\vec v', { size: 40, color: 'h' });
  const lA = new Tex(g, 'a', { size: 38, color: 'k', anchor: 'middle' }), lB = new Tex(g, 'b', { size: 38, color: 'k', anchor: 'end' });
  const lC = new Tex(g, 'c\\,\\vec u', { size: 34, color: 'k' }), lD = new Tex(g, 'd\\,\\vec v', { size: 34, color: 'k' });
  const pC = E('circle', { r: 7 }, g), pD = E('circle', { r: 7 }, g); pC.style.fill = pD.style.fill = C('k');

  // estado: f y u libres; v perpendicular a u (largo con signo sv) o libre
  let f = [2.6, 2.1], u = [1.55, .85], sv = 1.25, vLibre = [-.6, 1.3], libre = false;
  const perp = w => { const L = Math.hypot(...w); return [-w[1] / L, w[0] / L]; };
  const vAct = () => libre ? vLibre : perp(u).map(c => c * sv);
  const mF = new Manija(g, 'x', q => { f = lim(mundo(q)); redibujar(); });
  const mU = new Manija(g, 'h', q => { const w = lim(mundo(q)); if (Math.hypot(...w) > .35) u = w; redibujar(); });
  const mV = new Manija(g, 'h', q => {
    const w = lim(mundo(q));
    if (libre) { if (Math.hypot(...w) > .35) vLibre = w; }
    else { const s = dot(w, perp(u)); if (Math.abs(s) > .35) sv = s; }
    redibujar();
  });

  // derecha: las cuentas, en vivo
  const X0 = 1110;
  const tB = new Tex(g, 'B = \\{\\hat e_1,\\ \\hat e_2\\}', { size: 40, x: X0, y: 250 });
  const tF1 = new Tex(g, '\\vec f = a\\,\\hat e_1 + b\\,\\hat e_2', { size: 40, x: X0, y: 330 });
  const rA = new Lectura(g, 'a = \\vec f\\cdot\\hat e_1 =', { size: 36, x: X0 + 30, y: 410, colorNum: 'k' });
  const rB = new Lectura(g, 'b = \\vec f\\cdot\\hat e_2 =', { size: 36, x: X0 + 400, y: 410, colorNum: 'k' });
  const tBt = new Tex(g, '\\tilde B = \\{\\vec u,\\ \\vec v\\}', { size: 40, x: X0, y: 545 });
  const rUV = new Lectura(g, '\\vec u\\cdot\\vec v =', { size: 34, x: X0 + 330, y: 545 });
  const tF2 = new Tex(g, '\\vec f = c\\,\\vec u + d\\,\\vec v', { size: 40, x: X0, y: 630 });
  const tNo = new Tex(g, 'c\\,\\vec u + d\\,\\vec v \\neq \\vec f', { size: 40, x: X0, y: 630, color: 'ruido' });
  const rC = new Lectura(g, 'c = \\dfrac{\\vec f\\cdot\\vec u}{\\|\\vec u\\|^2} =', { size: 36, x: X0 + 30, y: 750, colorNum: 'k' });
  const rD = new Lectura(g, 'd = \\dfrac{\\vec f\\cdot\\vec v}{\\|\\vec v\\|^2} =', { size: 36, x: X0 + 400, y: 750, colorNum: 'k' });
  const pas = new Pastillas(g, X0, 875, [[false, 'base ortogonal'], [true, 'cualquier base']], l => {
    if (!l) { const s = dot(vLibre, perp(u)); sv = Math.abs(s) > .35 ? s : 1.25; } else vLibre = vAct();
    libre = l; redibujar();
  });
  const pis = pista(g, 'las puntas de las flechas se arrastran', 585, 975);
  const T1 = 2.4;
  const ley = leyendas(g, [['con una base ortogonal, cada coeficiente sale de un producto interno', T1 + 1.8]], { size: 38, y: 1040 });

  let tUlt = 0;
  const yo = {
    steps: [T1, 3.4],
    render(t) {
      tUlt = t;
      const pE = P(t, 0, 1), pF = P(t, .5, .9), pAB = P(t, 1.1, .8), pR = P(t, .4, 1.4);
      const pUV = P(t, T1, .9), pCD = P(t, T1 + .7, .8), pR2 = P(t, T1 + .4, 1.4), pPas = P(t, T1 + 1.4, .6);
      titulo.write(P(t, 0, .9)); ax.create(pE); e1.grow(pE); e2.grow(pE); le1.write(pE); le2.write(pE);
      // f y sus coordenadas en la base canónica (se atenúan cuando entra la otra base)
      const Fp = W(f), atenua = 1 - .6 * pUV;
      poner(aF, O, Fp, pF); lF.at(Fp[0] + 14, Fp[1] - 16).write(pF); mF.at(...Fp).alpha(pF >= 1 ? 1 : 0);
      gA.set([Fp, W([f[0], 0])]).create(pAB * atenua); gB.set([Fp, W([0, f[1]])]).create(pAB * atenua);
      lA.at(W([f[0], 0])[0], O[1] + (f[1] >= 0 ? 46 : -18)).write(pAB).alpha(pAB > 0 ? atenua : 0);
      lB.at(O[0] - 16, W([0, f[1]])[1] + 12).write(pAB).alpha(pAB > 0 ? atenua : 0);
      // la otra base, las proyecciones y (si no es ortogonal) la suma que no da f
      const v = vAct(), Up = W(u), Vp = W(v), c = dot(f, u) / dot(u, u), d = dot(f, v) / dot(v, v);
      const cu = u.map(q => q * c), dv = v.map(q => q * d), s = [cu[0] + dv[0], cu[1] + dv[1]];
      const lejos = w => { const L = 20 / Math.hypot(...w); return [W([-w[0] * L, -w[1] * L]), W([w[0] * L, w[1] * L])]; };
      rectaU.set(lejos(u)).create(pUV); rectaV.set(lejos(v)).create(pUV);
      poner(aU, O, Up, pUV); poner(aV, O, Vp, pUV);
      lU.at(Up[0] + 12, Up[1] - 14).write(pUV); lV.at(Vp[0] + 12, Vp[1] - 14).write(pUV);
      mU.at(...Up).alpha(pUV >= 1 ? 1 : 0); mV.at(...Vp).alpha(pUV >= 1 ? 1 : 0);
      gC.set([Fp, W(cu)]).create(pCD); gD.set([Fp, W(dv)]).create(pCD);
      pC.setAttribute('cx', W(cu)[0]); pC.setAttribute('cy', W(cu)[1]); pD.setAttribute('cx', W(dv)[0]); pD.setAttribute('cy', W(dv)[1]);
      pC.style.opacity = pD.style.opacity = pCD;
      lC.at(W(cu)[0] + 14, W(cu)[1] + 36).write(pCD); lD.at(W(dv)[0] - 76, W(dv)[1] - 14).write(pCD);
      const falla = libre && Math.hypot(s[0] - f[0], s[1] - f[1]) > .04 ? pCD : 0;
      poner(aS, O, W(s), 1).alpha(falla); gS1.set([W(cu), W(s)]).create(falla); gS2.set([W(dv), W(s)]).create(falla);
      // cuentas
      tB.write(pR); tF1.write(pR); rA.set(f[0]).write(pR); rB.set(f[1]).write(pR);
      const uv = dot(u, v);
      tBt.write(pR2); rUV.set(uv).color(Math.abs(uv) < .005 ? 'h' : 'ruido').write(pR2);
      tF2.write(falla ? 0 : pR2); tNo.write(falla ? pR2 : 0);
      rC.set(c).write(pR2); rD.set(d).write(pR2);
      pas.alpha(pPas); pis.write(P(t, 1.4, .8)); ley(t);
    },
  };
  const redibujar = () => yo.render(tUlt);
  return yo;
});

/* ════════════════════════════════════════════════════════════════════════════
   3  En ℝᴺ: un vector es el gráfico de sus coeficientes; con N → ∞, una función.
      El ℝ³ se gira arrastrando; los f_n se arrastran (con N = 3) y después manda el slider de N.
   ════════════════════════════════════════════════════════════════════════════ */
slide('rn', g => {
  const titulo = new Mix(g, 'En $\\mathbb R^N$', { size: 54, x: 70, y: 80 });
  // izquierda: ℝ³ en perspectiva. Coordenadas (f₁, f₂, f₃): ê₂ para arriba, ê₃ hacia quien mira.
  const O3 = [450, 650], S3 = 270, EL = .38; let th = -.72;
  const pr = ([a, b, c]) => {
    const x = a * Math.cos(th) + c * Math.sin(th), z = -a * Math.sin(th) + c * Math.cos(th);
    return [O3[0] + S3 * x, O3[1] - S3 * (b * Math.cos(EL) - z * Math.sin(EL))];
  };
  let giro = null;
  const zona = E('rect', { x: 120, y: 220, width: 700, height: 700, fill: 'transparent' }, g); zona.style.cursor = 'grab';
  arrastrable(zona, q => { giro ??= { x: q.x, th }; th = giro.th + (q.x - giro.x) / 260; redibujar(); }, () => giro = null);
  const DIR = [[1, 0, 0], [0, 1, 0], [0, 0, 1]], DIR_N = [-.62, .6, -.5];
  const ejes = DIR.map(() => new Arrow(g, 0, 0, 1, 1, { color: 'fg', width: 3.5, head: 18 }));
  const lEjes = ['\\hat e_1', '\\hat e_2', '\\hat e_3'].map(s => new Tex(g, s, { size: 36, anchor: 'middle' }));
  const ejeN = new Arrow(g, 0, 0, 1, 1, { color: 'fg', width: 3.5, head: 18, dash: '3 10' });
  const lN = new Tex(g, '\\hat e_N', { size: 36, anchor: 'middle' }), lPuntos = new Tex(g, '\\cdots', { size: 36, anchor: 'middle', color: 'dim' });
  const guias = [0, 1, 2].map(() => new Curve(g, null, { color: 'dim', width: 2, dash: '6 8' }));
  const aF = new Arrow(g, 0, 0, 1, 1, { color: 'x', width: 5.5, head: 26 }), lF = new Tex(g, '\\vec f', { size: 44, color: 'x' });
  const tR3 = new Tex(g, '\\vec f = f_1\\,\\hat e_1 + f_2\\,\\hat e_2 + f_3\\,\\hat e_3', { size: 40, x: 130, y: 250 });
  const tRN = new Tex(g, '\\vec f = \\sum_{n=1}^{N} f_n\\,\\hat e_n', { size: 40, x: 130, y: 250 });
  const noEntra = new Mix(g, 'con $N > 3$ ya no lo podemos dibujar…', { size: 32, x: 450, y: 965, anchor: 'middle', italic: true, color: 'dim' });

  // derecha: el mismo vector como gráfico de sus coeficientes
  const ax = new Axes(g, { x0: 1080, x1: 1790, y0: 300, y1: 840, xr: [0, 1.06], yr: [-.65, 1.25], base: 0, xlabel: 'n/N' });
  const lFn = new Tex(g, 'f_n', { size: 38, x: 1098, y: 292, color: 'x' });
  const marcas = E('path', {}, g); Object.assign(marcas.style, { stroke: C('ax'), strokeWidth: 2.5 });
  const t1 = new Tex(g, '1', { size: 28, x: ax.X(1), y: ax.yb + 38, anchor: 'middle', color: 'dim' });
  const t1N = new Tex(g, '\\tfrac1N', { size: 28, anchor: 'middle', color: 'dim' });
  const stems = new Stems(g, ax.Y(0), { color: 'x', r: 7, width: 4 });
  const lfi = [1, 2, 3].map(i => new Tex(g, `f_${i}`, { size: 32, anchor: 'middle', color: 'x' }));
  const curva = new Curve(g, linspace(0, 1, 200).map(x => [ax.X(x), ax.Y((1 - x) ** 2)]), { color: 'x', width: 3 });
  const lCurva = new Tex(g, 'f(x) = (1-x)^2', { size: 38, x: ax.X(.42), y: ax.Y(.55), color: 'x' });
  const tFn = new Tex(g, 'f_n = \\Big(1 - \\frac{n}{N}\\Big)^2', { size: 40, x: 1100, y: 225, color: 'x' });
  let fv = [1, .75, .3];   // el vector "libre" de ℝ³
  const mS = [0, 1, 2].map(i => new Manija(g, 'x', q => {
    fv[i] = clamp(ax.yr[0] + (ax.y1 - q.y) / (ax.y1 - ax.y0) * (ax.yr[1] - ax.yr[0]), -.55, 1.15); redibujar();
  }));
  const NS = [3, 4, 5, 6, 8, 10, 12, 16, 20, 30, 40, 60, 100, 200, 300];
  const sl = new Deslizador(g, 1110, 1560, 965, NS, () => redibujar(), { rotulo: 'dimensión', texto: N => `$N = ${N}$` });
  const pis = pista(g, 'el $\\mathbb R^3$ se gira arrastrando; las puntas de los $f_n$ se arrastran', 960, 1040);
  const T1 = 2.2, T2 = T1 + 2.2, T3 = T2 + 2.6;
  const ley = leyendas(g, [['con $N \\to \\infty$, el gráfico de los $f_n$ es una función', T3 + .2]], { size: 38, y: 1040 });

  let tUlt = 0;
  const yo = {
    steps: [T1, T2 - T1, T3 - T2, 2],
    render(t) {
      tUlt = t;
      const p0 = P(t, 0, 1), pF = P(t, .5, .9), pR = P(t, T1, 1), pFor = P(t, T2, 1.2), pN = P(t, T2 + .4, .9), pC = P(t, T3, 1);
      titulo.write(P(t, 0, .9));
      // ℝ³: con N = 3 se ve el vector; después queda el esquema de ℝᴺ
      const N = pFor > 0 ? sl.v : 3, formula = i => (1 - (i + 1) / N) ** 2;
      const f3 = [0, 1, 2].map(i => pFor > 0 && N === 3 ? lerp(fv[i], formula(i), pFor) : pFor > 0 ? formula(i) : fv[i]);
      const o = pr([0, 0, 0]), vis3 = 1 - (N > 3 ? 1 : 0);
      DIR.forEach((d, i) => {
        const pt = pr(d.map(c => c * 1.15)), lbl = pr(d.map(c => c * 1.32));
        poner(ejes[i], o, pt, p0); lEjes[i].at(lbl[0], lbl[1] + 12).write(p0);
      });
      const ptN = pr(DIR_N), lblN = pr(DIR_N.map(c => c * 1.2)), mid = pr([-.45, .2, .35]);
