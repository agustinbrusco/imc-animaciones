<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aplicaciones de Fourier</title>
<style>
@font-face{font-family:"CMU";src:url("../vendor/cmu/cmu-serif-500-roman.woff2") format("woff2");font-weight:400;font-style:normal}
@font-face{font-family:"CMU";src:url("../vendor/cmu/cmu-serif-500-italic.woff2") format("woff2");font-weight:400;font-style:italic}
@font-face{font-family:"CMU";src:url("../vendor/cmu/cmu-serif-700-roman.woff2") format("woff2");font-weight:700;font-style:normal}

/* Tema claro (por defecto): pensado para proyector. Colores oscuros y saturados, nada de pasteles. */
:root{
  --bg:#ffffff; --fg:#141414; --ax:#3a3a3a; --dim:#6a6a6a; --tenue:#a0a0a0;
  --x:#1450a8;      /* espacio real / tiempo */
  --k:#c4420a;      /* frecuencias */
  --h:#1b7a32;      /* operador H(k) */
  --ruido:#7a2bbf;  /* ruido */
}
:root[data-theme=dark]{
  --bg:#121315; --fg:#f2f2f2; --ax:#c4c4c4; --dim:#9c9c9c; --tenue:#686868;
  --x:#5fb4ff; --k:#ff8a3d; --h:#5ed473; --ruido:#c99bff;
}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;user-select:none;overscroll-behavior:none}
#stage{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:var(--bg)}
text{font-family:"CMU",serif}
/* colores dentro de fórmulas: \class{cx}{...} */
.cx{fill:var(--x);stroke:var(--x)} .ck{fill:var(--k);stroke:var(--k)}
.ch{fill:var(--h);stroke:var(--h)} .cr{fill:var(--ruido);stroke:var(--ruido)} .cd{fill:var(--dim);stroke:var(--dim)}
/* imágenes con una versión por tema */
:root[data-theme=dark] .solo-claro, :root:not([data-theme=dark]) .solo-oscuro{display:none}
.parlante{cursor:pointer} .parlante:hover{opacity:.7}
#hud{position:fixed;right:10px;bottom:6px;font:15px "CMU",serif;color:var(--dim);opacity:.55;cursor:pointer;padding:4px 8px;border-radius:6px}
#hud:hover{opacity:1;background:color-mix(in srgb, var(--tenue) 25%, transparent)}
/* menú de slides: se despliega hacia arriba desde el número */
#menu{position:fixed;right:10px;bottom:38px;width:min(800px,92vw);max-height:82vh;overflow:auto;z-index:10;
  background:var(--bg);border:1.5px solid var(--tenue);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.2);padding:14px}
#grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.mini{cursor:pointer;border:2px solid transparent;border-radius:9px;padding:5px;font:15px "CMU",serif;color:var(--dim)}
.mini:hover{border-color:var(--tenue)} .mini.actual{border-color:var(--h);color:var(--fg)}
.mini svg{display:block;width:100%;aspect-ratio:16/9;background:var(--bg);border:1px solid var(--tenue);border-radius:5px;margin-bottom:4px}
#cargando{position:fixed;inset:0;display:grid;place-items:center;font:28px "CMU",serif;color:var(--dim)}
</style>
<script>
window.MathJax = {
  svg: { fontCache: 'none' },
  startup: { typeset: false },
  tex: { macros: { F: '\\mathcal{F}' } }
};
</script>
<script src="../vendor/mathjax/tex-svg-full.js"></script>
<script src="datos.js" onerror="window.DATOS = null"></script>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet"></svg>
<div id="hud" title="Ir a una slide (M)"></div>
<div id="menu" hidden><div id="grilla"></div></div>
<div id="cargando">cargando…</div>
<script>
/* ════════════════════════════════════════════════════════════════════════════
   Motor: cada slide arma sus objetos una vez y expone render(t), una función
   pura del tiempo local. Sus "pasos" son tramos [b_k, b_k+1]: un click anima el
   tramo siguiente; volver atrás salta al final del tramo anterior sin animar.
   ════════════════════════════════════════════════════════════════════════════ */
const NS = 'http://www.w3.org/2000/svg';
const stage = document.getElementById('stage');
function E(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = v => { v = clamp(v); return v * v * v * (v * (v * 6 - 15) + 10); };
const P = (t, a, d = 1) => d <= 0 ? (t >= a ? 1 : 0) : smooth((t - a) / d);   // progreso suave
const lin = (t, a, d) => clamp((t - a) / d);                                    // progreso lineal
const lerp = (a, b, p) => a + (b - a) * p;
const C = n => `var(--${n})`;
const pathD = pts => 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L');
const lerpPts = (A, B, p) => A.map((a, i) => [lerp(a[0], B[i][0], p), lerp(a[1], B[i][1], p)]);
const fmt = (v, d = 0) => v.toLocaleString('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d });
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function gauss(r) { return Math.sqrt(-2 * Math.log(r() + 1e-12)) * Math.cos(2 * Math.PI * r()); }

// FFT radix-2 (in place) y módulo de la DFT de una señal real
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let b = n >> 1; for (; j & b; b >>= 1) j ^= b; j ^= b;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const a = -2 * Math.PI / len, wr = Math.cos(a), wi = Math.sin(a);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const ur = re[i + k], ui = im[i + k], j = i + k + len / 2;
        const vr = re[j] * cr - im[j] * ci, vi = re[j] * ci + im[j] * cr;
        re[i + k] = ur + vr; im[i + k] = ui + vi; re[j] = ur - vr; im[j] = ui - vi;
        [cr, ci] = [cr * wr - ci * wi, cr * wi + ci * wr];
      }
    }
  }
}
function modDFT(x) { const re = Float64Array.from(x), im = new Float64Array(x.length); fft(re, im); return Array.from({ length: x.length / 2 + 1 }, (_, k) => Math.hypot(re[k], im[k])); }
const hann = M => Array.from({ length: M }, (_, n) => Math.sin(Math.PI * n / M) ** 2);

/* ── mapas de color de los espectrogramas (de fondo a "mucha energía", uno por tema) ── */
const MAPAS = {
  claro: [[0, '#ffffff'], [.35, '#f2b38a'], [.7, '#c4420a'], [1, '#2a0c00']],
  oscuro: [[0, '#121315'], [.35, '#6a2a08'], [.7, '#ff8a3d'], [1, '#fff1dc']],
};
function colorMapa(v, mapa) {
  const st = MAPAS[mapa]; let i = 1; while (i < st.length - 1 && v > st[i][0]) i++;
  const [a, ca] = st[i - 1], [b, cb] = st[i], q = clamp((v - a) / (b - a));
  return [1, 3, 5].map(j => lerp(parseInt(ca.substr(j, 2), 16), parseInt(cb.substr(j, 2), 16), q));
}
// matriz v[fila][col] en [0,1] (fila 0 = frecuencia alta) → dataURL PNG
function pngMapa(v, mapa) {
  const h = v.length, w = v[0].length, cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const cx = cv.getContext('2d'), im = cx.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const [r, g, b] = colorMapa(v[y][x], mapa), o = 4 * (y * w + x);
    im.data[o] = r; im.data[o + 1] = g; im.data[o + 2] = b; im.data[o + 3] = 255;
  }
  cx.putImageData(im, 0, 0);
  return cv.toDataURL();
}

/* ── audio ─────────────────────────────────────────────────────────────────── */
// Sólo suena cuando se avanza a un paso que lo pide: nunca al entrar a una slide.
const AUD = {}, PARLANTES = []; let sonando = null;
function sonar(n) {
  callar();
  if (!window.DATOS || !DATOS.audio[n] || window.__exportando) return;
  AUD[n] ??= new Audio('data:audio/mpeg;base64,' + DATOS.audio[n]);
  sonando = AUD[n]; sonando.currentTime = 0; sonando.play().catch(() => {});
}
function callar() { if (sonando) { sonando.pause(); sonando = null; } }

/* ── objetos ("mobjects") ─────────────────────────────────────────────────── */
class M {
  constructor(parent) { this.g = E('g', {}, parent); this.x = 0; this.y = 0; this.s = 1; }
  at(x, y, s = 1) { this.x = x; this.y = y; this.s = s; this.g.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${s})`); return this; }
  alpha(a) { this.g.style.opacity = a; this.g.style.visibility = a > 0.001 ? 'visible' : 'hidden'; return this; }
}

// Texto (CMU). write(p): se dibuja el contorno y después se rellena, como Write de Manim.
class Txt extends M {
  constructor(parent, str, o = {}) {
    super(parent);
    this.size = o.size || 40;
    this.t = E('text', { x: 0, y: 0, 'font-size': this.size, 'text-anchor': o.anchor || 'start' }, this.g);
    if (o.italic) this.t.setAttribute('font-style', 'italic');
    if (o.bold) this.t.setAttribute('font-weight', 700);
    this.t.textContent = str;
    const col = C(o.color || 'fg');
    Object.assign(this.t.style, { fill: col, stroke: col, strokeLinejoin: 'round' });
    if (o.x !== undefined) this.at(o.x, o.y);
    this.write(1);
  }
  get width() { return this.t.getComputedTextLength(); }
  write(p) {
    const L = this.size * 3.2, p1 = clamp(p / .6), p2 = clamp((p - .35) / .65);
    const st = this.t.style;
    st.strokeDasharray = `${L} ${L}`; st.strokeDashoffset = L * (1 - p1);
    st.strokeWidth = p >= 1 || p <= 0 ? 0 : this.size * .03 * (1 - p2);
    st.fillOpacity = p2; st.visibility = p > 0 ? 'visible' : 'hidden';
    return this;
  }
}

// Fórmula (MathJax → SVG con los glifos como paths). Origen = línea de base.
class Tex extends M {
  constructor(parent, src, o = {}) {
    super(parent);
    const size = o.size || 44, ex = size * 0.4306;
    const s = MathJax.tex2svg(src, { display: false }).querySelector('svg');
    const w = parseFloat(s.getAttribute('width')) * ex, h = parseFloat(s.getAttribute('height')) * ex;
    const va = parseFloat(((s.getAttribute('style') || '').match(/vertical-align:\s*(-?[\d.]+)ex/) || [0, 0])[1]) * ex;
    const x0 = o.anchor === 'middle' ? -w / 2 : o.anchor === 'end' ? -w : 0;
    s.setAttribute('x', x0); s.setAttribute('y', -h - va); s.setAttribute('width', w); s.setAttribute('height', h);
    s.removeAttribute('style'); s.style.overflow = 'visible';
    this.g.appendChild(s); this.g.style.color = C(o.color || 'fg');
    this.w = w; this.h = h; this.x0 = x0;
    this.parts = [...s.querySelectorAll('path,rect')];
    this.parts.forEach(q => q.tagName === 'path' && q.setAttribute('pathLength', 1));
    if (o.x !== undefined) this.at(o.x, o.y);
    this.write(1);
  }
  write(p) {
    const n = this.parts.length, lag = n > 1 ? .4 : 0;
    this.parts.forEach((q, i) => {
      const lp = clamp((p - (n > 1 ? i / (n - 1) * lag : 0)) / (1 - lag));
      if (q.tagName === 'rect') { q.style.opacity = lp; return; }
      const p1 = clamp(lp / .6), p2 = clamp((lp - .4) / .6), st = q.style;
      st.strokeDasharray = '1 1'; st.strokeDashoffset = 1 - p1;
      st.strokeWidth = lp >= 1 || lp <= 0 ? 0 : 26 * (1 - p2);
      st.fillOpacity = p2; st.visibility = lp > 0 ? 'visible' : 'hidden';
    });
    return this;
  }
}

// Texto con fórmulas intercaladas: 'espacio real · $x$'
class Mix extends M {
  constructor(parent, str, o = {}) {
    super(parent);
    const size = o.size || 40, inner = E('g', {}, this.g);
    this.parts = [];
    str.split('$').forEach((s, i) => {
      if (!s) return;
      let part;
      if (i % 2) { part = new Tex(inner, s, { size: size * 1.04, color: o.color }); part.wd = part.w; }
      else {
        if (!s.trim()) { this.parts.length && (this.parts.at(-1).trail = true); return; }
        part = new Txt(inner, s.trim(), { size, color: o.color, italic: o.italic, bold: o.bold });
        part.wd = part.width; part.lead = /^\s/.test(s); part.trail = /\s$/.test(s);
      }
      this.parts.push(part);
    });
    let x = 0;
    this.parts.forEach((p, i) => {
      if (i && (this.parts[i - 1].trail || p.lead)) x += size * .27;
      p.at(x, 0); x += p.wd;
    });
    this.w = x;
    inner.setAttribute('transform', `translate(${o.anchor === 'middle' ? -x / 2 : o.anchor === 'end' ? -x : 0},0)`);
    if (o.x !== undefined) this.at(o.x, o.y);
  }
  write(p) {
    let acc = 0;
    // cada parte arranca según su posición y la última termina justo en p = 1
    this.parts.forEach(q => { const a = acc / this.w, b = (acc + q.wd) / this.w; acc += q.wd; q.write(clamp((p - .75 * a) / (.25 + .75 * (b - a)))); });
    return this;
  }
}

// Curva (polilínea). create(p) la dibuja de punta a punta.
class Curve extends M {
  constructor(parent, pts, o = {}) {
    super(parent);
    this.p = E('path', { fill: 'none', 'stroke-linejoin': 'round', 'stroke-linecap': 'round', pathLength: 1 }, this.g);
    Object.assign(this.p.style, { stroke: C(o.color || 'x'), strokeWidth: o.width || 5 });
    if (o.clip) this.g.setAttribute('clip-path', `url(#${o.clip})`);
    this.dash = o.dash;
    if (pts) this.set(pts);
    this.create(1);
  }
  set(pts) { this.pts = pts; this.p.setAttribute('d', pathD(pts)); return this; }
  create(p) {
    if (this.dash) { this.p.removeAttribute('pathLength'); this.p.style.strokeDasharray = this.dash; this.alpha(p); return this; }
    this.p.style.strokeDasharray = '1 1'; this.p.style.strokeDashoffset = 1 - p;
    this.p.style.visibility = p > 0 ? 'visible' : 'hidden';
    return this;
  }
}

// Espectro como "stem plot": un palito por frecuencia, con punto si son pocos.
// set(tops, p, base): tops = [[x, y]]; p = progreso de aparición (de izquierda a derecha).
class Stems extends M {
  constructor(parent, base, o = {}) {
    super(parent);
    this.base = base; this.r = o.r ?? 6;
    const col = C(o.color || 'k');
    this.p = E('path', { fill: 'none' }, this.g);
    Object.assign(this.p.style, { stroke: col, strokeWidth: o.width || 3.5 });
    this.d = E('path', {}, this.g); this.d.style.fill = col;
  }
  set(tops, p = 1, base = this.base) {
    const n = tops.length, r = this.r; let d = '', dd = '';
    tops.forEach(([x, y], i) => {
      const q = smooth(p * 1.6 - i / n * .6); if (q <= 0) return;
      const yt = lerp(base, y, q); if (base - yt < .8) return;
      d += `M${x.toFixed(1)},${base.toFixed(1)}V${yt.toFixed(1)}`;
      if (r > 0 && q > .5) { const rr = r * clamp(q * 2 - 1); dd += `M${(x - rr).toFixed(1)},${yt.toFixed(1)}a${rr},${rr} 0 1,0 ${2 * rr},0a${rr},${rr} 0 1,0 ${-2 * rr},0`; }
    });
    this.p.setAttribute('d', d || 'M0,0'); this.d.setAttribute('d', dd || 'M0,0');
    return this;
  }
}

// Flecha recta. grow(p) la estira desde el origen.
class Arrow extends M {
  constructor(parent, x1, y1, x2, y2, o = {}) {
    super(parent);
    Object.assign(this, { x1, y1, x2, y2, hl: o.head || 22 });
    const col = C(o.color || 'fg');
    this.l = E('line', { 'stroke-linecap': 'butt' }, this.g);
    Object.assign(this.l.style, { stroke: col, strokeWidth: o.width || 4 });
    if (o.dash) this.l.style.strokeDasharray = o.dash;
    this.h = E('path', { d: `M0,0L${-this.hl},${-this.hl * .42}L${-this.hl * .78},0L${-this.hl},${this.hl * .42}Z` }, this.g);
    this.h.style.fill = col;
    this.grow(1);
  }
  grow(p) {
    const { x1, y1, x2, y2, hl } = this, L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L;
    const x = lerp(x1, x2, p), y = lerp(y1, y2, p), back = Math.min(hl * .8, L * p);
    this.l.setAttribute('x1', x1); this.l.setAttribute('y1', y1);
    this.l.setAttribute('x2', x - ux * back); this.l.setAttribute('y2', y - uy * back);
    this.h.setAttribute('transform', `translate(${x},${y}) rotate(${Math.atan2(uy, ux) * 180 / Math.PI}) scale(${clamp(p * 4)})`);
    this.alpha(p > 0 ? 1 : 0);
    return this;
  }
}

// Ejes cartesianos (y lineal o logarítmica en décadas). xticks/yticks: [[valor, 'tex']].
class Axes extends M {
  constructor(parent, o) {
    super(parent);
    Object.assign(this, o);   // x0 x1 y0 y1 xr yr log base(valor y del eje x)
    const yb = this.yb = this.Y(o.base ?? o.yr[0]);
    this.ax = new Curve(this.g, [[this.x0 - 6, yb], [this.x1 + 26, yb]], { color: 'ax', width: 2.5 });
    this.ay = new Curve(this.g, [[this.x0, this.y1 + 6], [this.x0, this.y0 - 26]], { color: 'ax', width: 2.5 });
    const hd = 'M0,0L-14,-6.5L-11,0L-14,6.5Z';
    this.hx = E('path', { d: hd, transform: `translate(${this.x1 + 30},${yb})` }, this.g);
    this.hy = E('path', { d: hd, transform: `translate(${this.x0},${this.y0 - 30}) rotate(-90)` }, this.g);
    this.hx.style.fill = this.hy.style.fill = C('ax');
    this.extra = [];
    if (o.xlabel) this.extra.push(new Tex(this.g, o.xlabel, { size: 36, x: this.x1 + 30, y: yb + 44, anchor: 'middle', color: 'ax' }));
    let marcas = '';
    for (const [v, s] of o.xticks || []) { marcas += `M${this.X(v)},${yb}v9`; this.extra.push(new Tex(this.g, s, { size: 28, x: this.X(v), y: yb + 38, anchor: 'middle', color: 'dim' })); }
    for (const [v, s] of o.yticks || []) { marcas += `M${this.x0},${this.Y(v)}h-9`; this.extra.push(new Tex(this.g, s, { size: 28, x: this.x0 - 16, y: this.Y(v) + 10, anchor: 'end', color: 'dim' })); }
    this.marcas = E('path', { d: marcas || 'M0,0' }, this.g);
    Object.assign(this.marcas.style, { stroke: C('ax'), strokeWidth: 2.5 });
  }
  X(u) { return this.x0 + (u - this.xr[0]) / (this.xr[1] - this.xr[0]) * (this.x1 - this.x0); }
  Y(v) {
    if (this.log) v = Math.log10(Math.max(v, 10 ** this.yr[0]));
    return this.y1 - (clamp(v, this.yr[0], Infinity) - this.yr[0]) / (this.yr[1] - this.yr[0]) * (this.y1 - this.y0);
  }
  pts(xs, ys) { return xs.map((u, i) => [this.X(u), this.Y(ys[i])]); }
  create(p) {
    this.ax.create(p); this.ay.create(p);
    this.hx.style.opacity = this.hy.style.opacity = this.marcas.style.opacity = clamp(p * 3 - 2);
    this.extra.forEach(e => e.write(clamp(p * 2 - 1)));
    return this;
  }
}

// Línea punteada que crece (divisor entre los dos mundos).
class DLine extends M {
  constructor(parent, x1, y1, x2, y2, o = {}) {
    super(parent);
    Object.assign(this, { x1, y1, x2, y2 });
    this.l = E('line', { x1, y1, 'stroke-linecap': 'round' }, this.g);
    Object.assign(this.l.style, { stroke: C(o.color || 'tenue'), strokeWidth: o.width || 3.5, strokeDasharray: o.dash || '3 11' });
    this.grow(1);
  }
  grow(p) { this.l.setAttribute('x2', lerp(this.x1, this.x2, p)); this.l.setAttribute('y2', lerp(this.y1, this.y2, p)); this.alpha(p > 0 ? 1 : 0); return this; }
}

// Imagen (dataURL) con una versión por tema; reveal(p) la descubre de izquierda a derecha.
class Img extends M {
  constructor(parent, urls, x, y, w, h) {
    super(parent);
    const id = 'clip' + Math.random().toString(36).slice(2, 8);
    const cp = E('clipPath', { id }, this.g);
    this.r = E('rect', { x, y, width: w, height: h }, cp);
    Object.assign(this, { x0: x, w });
    for (const [tema, url] of Object.entries(urls))
      E('image', { href: url, x, y, width: w, height: h, preserveAspectRatio: 'none', class: 'solo-' + tema, 'clip-path': `url(#${id})` }, this.g);
  }
  reveal(p) { this.r.setAttribute('x', this.x0); this.r.setAttribute('width', Math.max(0, this.w * p)); this.alpha(p > 0 ? 1 : 0); return this; }
  cambiar(urls, x, w) {   // otra imagen (y otro ancho) en el mismo lugar
    this.x0 = x; this.w = w;
    for (const im of this.g.querySelectorAll('image')) {
      const tema = im.getAttribute('class').replace('solo-', '');
      im.setAttribute('href', urls[tema]); im.setAttribute('x', x); im.setAttribute('width', w);

  }
  ventana(xa, xb) { this.r.setAttribute('x', xa); this.r.setAttribute('width', Math.max(0, xb - xa)); return this; }
}

// Parlante clickeable: reproduce un audio (o el que devuelva la función).

// Cabezal de reproducción: una barra que recorre la onda mientras suena alguno de sus audios.
// Va sincronizado con el audio real (no con la línea de tiempo), así anda también con el parlante.
const CABEZALES = [];
class Cabezal {
  constructor(parent, nombres, x0, x1, y0, y1, dur) {
    Object.assign(this, { nombres, x0, x1, dur });
    this.g = E('g', {}, parent);
    this.sombra = E('rect', { y: y0, height: y1 - y0, x: x0, width: 0 }, this.g);
    Object.assign(this.sombra.style, { fill: C('h'), opacity: .12 });
    this.l = E('line', { y1: y0, y2: y1, 'stroke-linecap': 'round' }, this.g);
    Object.assign(this.l.style, { stroke: C('h'), strokeWidth: 4 });
    CABEZALES.push(this);
    this.actualizar();
  }
  actualizar() {
    const n = sonando && !sonando.paused && this.nombres.find(k => AUD[k] === sonando);
    this.g.style.display = n ? '' : 'none';
    if (!n) return;
    const x = lerp(this.x0, this.x1, clamp(sonando.currentTime / this.dur));
    this.l.setAttribute('x1', x); this.l.setAttribute('x2', x);
    this.sombra.setAttribute('width', x - this.x0);
  }
}

// Cajas (sin borde): arriba-izq f, arriba-der f̂, abajo-der H f̂, abajo-izq g.
const BOX = {

const MID = b => [(b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2];

function marco(g, o = {}) {
  const F = {};
  F.div = new DLine(g, 960, 150, 960, 900);
  F.lx = new Mix(g, o.izq || 'espacio real  ·  $x$', { size: 46, anchor: 'middle', x: 480, y: 160, color: 'x' });
  F.lk = new Mix(g, o.der || 'frecuencias  ·  $k$', { size: 46, anchor: 'middle', x: 1440, y: 160, color: 'k' });
  F.show = p => { F.div.grow(p); F.lx.write(p); F.lk.write(p); };
  return F;
}
// Flechas del diagrama: 𝓕 arriba, ×H a la derecha, 𝓕⁻¹ abajo, L (directo) a la izquierda.
function flechas(g, hTex = 'H(k)') {
  const A = {};
  A.F = new Arrow(g, 830, 332, 1090, 332);
  A.tF = tapa(g, 960, 296, 56, 50);
  A.Fl = new Tex(g, '\\F', { size: 52, x: 960, y: 308, anchor: 'middle' });
  A.H = new Arrow(g, 1450, 472, 1450, 626, { color: 'h' });
  A.Hl = new Tex(g, '\\times\\,' + hTex, { size: 46, x: 1478, y: 564, color: 'h' });
  A.Fi = new Arrow(g, 1090, 760, 830, 760);
  A.tFi = tapa(g, 960, 718, 80, 50);
  A.Fil = new Tex(g, '\\F^{-1}', { size: 52, x: 960, y: 736, anchor: 'middle' });
  A.L = new Arrow(g, 470, 472, 470, 626, { dash: '9 9', color: 'dim' });
  A.Ll = new Tex(g, 'L', { size: 46, x: 444, y: 564, anchor: 'end', color: 'dim' });
  // las tapas sólo se ven cuando se ve su rótulo
  A.tapas = () => { A.tF.style.opacity = A.Fl.parts[0].style.visibility === 'visible' ? 1 : 0; A.tFi.style.opacity = A.Fil.parts[0].style.visibility === 'visible' ? 1 : 0; };
  return A;
}
// Fondo para que una etiqueta tape el divisor punteado
function tapa(g, x, y, w, h) { const r = E('rect', { x: x - w / 2, y: y - h / 2, width: w, height: h }, g); r.style.fill = C('bg'); return r; }
// Rótulo de un panel, arriba a la izquierda
const rotulo = (g, s, b, col, dx = 18) => new Tex(g, s, { size: 38, x: b.x0 + dx, y: b.y0 - 8, color: col });
// Franja inferior: varias leyendas que se reemplazan [texto, desde, hasta]
function leyendas(g, lista, o = {}) {
  const ls = lista.map(([s, a, b]) => ({ m: new Mix(g, s, { size: o.size || 40, x: 960, y: o.y || 1000, anchor: 'middle', italic: o.italic }), a, b: b ?? 1e9 }));
  return t => ls.forEach(l => { l.m.write(P(t, l.a, .9)); l.m.alpha(1 - P(t, l.b, .35)); });

/* ════════════════════════════════════════════════════════════════════════════
   0.2  Dos mundos: una señal = suma de ondas; cada onda es un pico en k.
   ════════════════════════════════════════════════════════════════════════════ */
slide('dos-mundos', g => {
  const titulo = new Txt(g, 'Dos mundos', { size: 54, x: 70, y: 80 });
  const F = marco(g);
  const comps = [{ k: 2, a: 1, ph: 0 }, { k: 5, a: .6, ph: .9 }, { k: 11, a: .35, ph: 2.1 }];
  const n = 500, xs = Array.from({ length: n }, (_, i) => 2 * Math.PI * i / (n - 1));
  const X = x => 150 + x / (2 * Math.PI) * 640, ESC = 48;
  const yf = 335, filas = [540, 660, 780];
  const onda = (c, y0) => xs.map(x => [X(x), y0 - ESC * c.a * Math.sin(c.k * x + c.ph)]);
  const fPts = xs.map(x => [X(x), yf - ESC * comps.reduce((s, c) => s + c.a * Math.sin(c.k * x + c.ph), 0)]);
  const ejeF = new Curve(g, [[140, yf], [800, yf]], { color: 'tenue', width: 2 });
  const f = new Curve(g, fPts, { color: 'x' });
  const fl = new Tex(g, 'f(x)', { size: 44, x: 150, y: 240, color: 'x' });
  // eje k a la derecha
  const base = 858, Kx = k => 1150 + k * 46;
  const ejeK = new Axes(g, { x0: 1130, x1: 1770, y0: 300, y1: base, xr: [-0.43, 13.5], yr: [0, 1], xlabel: 'k' });
  ejeK.ay.g.style.display = ejeK.hy.style.display = 'none';
  const H = 470;
  const comp = comps.map((c, i) => {
    const desde = onda(c, filas[i]);
    const pico = desde.map((_, j) => [Kx(c.k), base - H * c.a * j / (n - 1)]);
    return {
      c, desde, pico,
      azul: new Curve(g, desde, { color: 'x', width: 4.5 }),     // se queda a la izquierda
      mov: new Curve(g, desde, { color: 'x', width: 4.5 }),      // la copia que viaja…
      nar: new Curve(g, desde, { color: 'k', width: 6 }),        // …y se vuelve pico
      signo: new Tex(g, i ? '+' : '=', { size: 46, x: 118, y: filas[i] + 14, anchor: 'middle' }),
      punto: (() => { const d = E('circle', { cx: Kx(c.k), cy: base - H * c.a, r: 9 }, g); d.style.fill = C('k'); return d; })(),
      kl: new Tex(g, String(c.k), { size: 36, x: Kx(c.k), y: base + 46, anchor: 'middle', color: 'k' }),
    };
  });
  const fhat = new Tex(g, '\\hat f(k)', { size: 44, x: 1150, y: 300, color: 'k' });
  const aF = new Arrow(g, 830, 610, 1090, 610), tp1 = tapa(g, 960, 574, 60, 54);
  const aFl = new Tex(g, '\\F', { size: 52, x: 960, y: 585, anchor: 'middle' });
  const aFi = new Arrow(g, 1090, 720, 830, 720), tp2 = tapa(g, 960, 688, 80, 54);
  const aFil = new Tex(g, '\\F^{-1}', { size: 52, x: 960, y: 700, anchor: 'middle' });
  const formula = new Tex(g, '\\class{cx}{f(x)} \\;=\\; \\sum_k \\class{ck}{\\hat f(k)}\\, e^{ikx}', { size: 52, x: 960, y: 985, anchor: 'middle' });
  const nota = new Txt(g, 'la misma función, en otras coordenadas', { size: 36, x: 960, y: 1050, anchor: 'middle', italic: true, color: 'dim' });

  return {
    steps: [1.4, 1.5, 1.8, 2.8, 1.8],
    render(t) {
      titulo.write(P(t, 0, .9)); F.show(P(t, .2, 1.1));
      // 1: f(x)
      const t1 = 1.4; ejeF.create(P(t, t1, .6)); f.create(P(t, t1 + .1, 1.3)); fl.write(P(t, t1 + .6, .8));
      // 2: se desarma en ondas; 3: cada onda viaja y se colapsa en un pico
      const t2 = 2.9, t3 = 4.7;
      ejeK.create(P(t, t3, .8)); aF.grow(P(t, t3, .7)); aFl.write(P(t, t3 + .2, .6));
      tp1.style.opacity = t >= t3 + .2 ? 1 : 0;
      comp.forEach((o, i) => {
        const pa = P(t, t2 + i * .25, 1.1);                 // copia de f → onda i
        const pb = P(t, t3 + .5 + i * .45, 1.3);            // onda i → pico
        o.azul.set(lerpPts(fPts, o.desde, pa)).create(pa > 0 ? 1 : 0);
        o.signo.write(P(t, t2 + .6 + i * .25, .5));
        const viaja = lerpPts(o.desde, o.pico, pb);
        o.mov.set(viaja).create(pb > 0 ? 1 : 0).alpha(1 - pb);
        o.nar.set(viaja).create(pb > 0 ? 1 : 0).alpha(pb);
        o.punto.style.opacity = P(t, t3 + 1.5 + i * .45, .3);
        o.kl.write(P(t, t3 + 1.5 + i * .45, .5));
      });
      fhat.write(P(t, t3 + 2.2, .6));
      // 4: vuelta
      const t4 = 7.5;
      aFi.grow(P(t, t4, .7)); aFil.write(P(t, t4 + .2, .6)); tp2.style.opacity = t >= t4 + .2 ? 1 : 0;
      formula.write(P(t, t4 + .5, 1.2)); nota.write(P(t, t4 + 1.1, .7));
    },
  };
});

/* ════════════════════════════════════════════════════════════════════════════
   A1  Derivar: H(k) = ik. Con ruido, ik levanta el piso de las k altas.
   ════════════════════════════════════════════════════════════════════════════ */
slide('derivar', g => {
  // datos: N = 128 puntos en [0, 2π)
  const N = 128, K = N / 2, KC = 10, SIG = .09;
  const xs = Array.from({ length: N + 1 }, (_, j) => 2 * Math.PI * j / N);
  const r = rng(7), ruido = Array.from({ length: N }, () => SIG * gauss(r));
  const f0 = xs.slice(0, N).map(x => Math.sin(3 * x) + .5 * Math.cos(7 * x));
  const fn = f0.map((v, j) => v + ruido[j]);
  const dft = v => {   // c_k = (1/N) Σ v_j e^{-ikx_j}, k = 0..K
    const a = [], b = [];
    for (let k = 0; k <= K; k++) { let re = 0, im = 0; for (let j = 0; j < N; j++) { re += v[j] * Math.cos(k * xs[j]); im -= v[j] * Math.sin(k * xs[j]); } a.push(re / N); b.push(im / N); }

const HZ = [[250, '250'], [500, '500'], [1000, '1000\\,\\text{Hz}']];
function espectrograma(x, M, salto, fmax, fs) {
  const w = hann(M), cols = [];
  for (let i = 0; i + M <= x.length; i += salto) cols.push(modDFT(x.slice(i, i + M).map((v, n) => v * w[n])).map(v => v * v));

  return { v, t0: M / 2 / fs, dt: salto / fs, ncols: cols.length };

/* ════════════════════════════════════════════════════════════════════════════

/* ── el marco de la receta, con imágenes cuadradas en vez de curvas ───────────── */
const kIdx = (i, n) => i < n / 2 ? i : i - n;   // índice de la FFT → frecuencia (con signo)
function multiplicar(z, n, H) {   // H(kx, ky) · ẑ
  const re = new Float64Array(n * n), im = new Float64Array(n * n);
  for (let j = 0; j < n; j++) for (let l = 0; l < n; l++) {
    const i = j * n + l, h = H(kIdx(l, n), kIdx(j, n)); re[i] = z.re[i] * h; im[i] = z.im[i] * h;
  }
  return { re, im };
}
function antitransformar(z, n) { const re = Float64Array.from(z.re), im = Float64Array.from(z.im); ifft2(re, im, n); return re; }
function mapaH(H, n) {   // H en el plano (k_x, k_y), centrado, llevado a [0, 1]
  const v = new Float64Array(n * n); let mx = 0;
  for (let j = 0; j < n; j++) for (let l = 0; l < n; l++) mx = Math.max(mx, v[j * n + l] = H(l - n / 2, j - n / 2));
  return v.map(x => x / mx);
}
function marcoImg(g) {

  const A = {};
  A.F = new Arrow(g, 650, 340, 1270, 340); A.tF = tapa(g, 960, 304, 60, 50);

  A.Fi = new Arrow(g, 1270, 730, 650, 730); A.tFi = tapa(g, 960, 688, 80, 50);
  A.Fil = new Tex(g, '\\F^{-1}', { size: 52, x: 960, y: 706, anchor: 'middle' });
  A.H = new Arrow(g, 1440, 488, 1440, 572, { color: 'h' });

  A.tapas = () => { A.tF.style.opacity = A.Fl.parts[0].style.visibility === 'visible' ? 1 : 0; A.tFi.style.opacity = A.Fil.parts[0].style.visibility === 'visible' ? 1 : 0; };
  const cuadro = (urls, p, o = {}) => new Cuadro(g, urls, { cx: POS[p][0], cy: POS[p][1], lado: S, ...o });

    ['pasa-bajos', '\\Theta(k_c - |k|)', k => Math.abs(k) < .45 ? 1 : 0],
    ['umbral, comprimir', '\\Theta(|\\hat f(k)| - \\tau)', null],
    ['desenfocar (núcleo gaussiano)', 'e^{-|\\mathbf{k}|^2/2\\sigma^2}', gauss],
    ['bordes (laplaciano)', '-|\\mathbf{k}|^2', k => k * k],
    ['convolucionar con un núcleo $h$', '\\hat h(\\mathbf{k})', null],
  ].map(([op, h, f], i) => {
    const y = Y0 + i * DY, base = y + 14;
    const o = { op: new Mix(g, op, { size: 40, x: X1, y: y + 12 }), h: new Tex(g, h, { size: 44, x: X2, y: y + 14, color: 'h' }) };
    o.eje = new Curve(g, [[X3, base], [X3 + W, base]], { color: 'tenue', width: 2 });
    o.cero = new Curve(g, [[X3 + W / 2, base + 8], [X3 + W / 2, base - ALTO - 6]], { color: 'tenue', width: 2 });
    if (!f) o.eje.g.style.display = o.cero.g.style.display = 'none';   // sin un dibujo fijo
    const ks = Array.from({ length: 201 }, (_, j) => -1 + j / 100);
    if (f) o.c = new Curve(g, ks.map(k => [X3 + (k + 1) / 2 * W, base - ALTO * f(k)]), { color: 'h', width: 4.5 });
    return o;
  });
  const notas = [[2, 'depende de $\\hat f$: no es lineal'], [5, 'la transformada del núcleo (cualquiera)']].map(([i, s]) => new Mix(g, s, { size: 32, x: X3, y: Y0 + i * DY + 12, italic: true, color: 'dim' }));
  const ley = leyendas(g, [['transformar  ·  multiplicar por $\\class{ch}{H(k)}$  ·  antitransformar', 6.0]], { size: 44 });
  const T1 = 2.4, T2 = 3.8;
  return {
    steps: [2.4, 1.4, 3.2],
    render(t) {
      tit.write(P(t, 0, .9));
      cab.forEach((c, i) => c.write(P(t, .3 + i * .15, .6))); raya.create(P(t, .3, .8));
      const entra = [.6, 1.3, T1, T2, T2 + .6, T2 + 1.2];
      FILAS.forEach((o, i) => {
        const a = entra[i];
        o.op.write(P(t, a, .6)); o.h.write(P(t, a + .2, .7));
        o.eje.create(P(t, a + .3, .5)); o.cero.create(P(t, a + .3, .5));
        o.c?.create(P(t, a + .5, .8));
      });
      notas[0].write(P(t, T1 + .4, .8)); notas[1].write(P(t, T2 + 1.6, .8));
      ley(t);
    },
  };
});

/* ════════════════════════════════════════════════════════════════════════════
   Cierre: y hay mucho más. Ocho aplicaciones para explorar, cada una con un dibujito.
   ════════════════════════════════════════════════════════════════════════════ */
slide('mas-aplicaciones', g => {
  const titulo = new Txt(g, 'Y hay mucho más', { size: 54, x: 70, y: 80 });
  const sub = new Txt(g, 'para seguir explorando por su cuenta', { size: 34, x: 1850, y: 80, anchor: 'end', italic: true, color: 'dim' });
  const XS = [270, 723, 1176, 1630], YS = [270, 640], W = 300, AL = 150;
  const caja = (i, j) => ({ cx: XS[i], cy: YS[j], x0: XS[i] - W / 2, x1: XS[i] + W / 2, y0: YS[j] - AL / 2, y1: YS[j] + AL / 2 });
  const r = rng(21);
  const items = [];
  // cada ítem: { dibujo: M, anima(p, t) opcional, nombre, desc }
  const item = (i, j, nombre, desc, armar) => {
    const b = caja(i, j), m = new M(g);
    const anima = armar(m.g, b) || (() => {});
    items.push({ m, anima, nombre: new Txt(g, nombre, { size: 34, x: b.cx, y: b.y1 + 52, anchor: 'middle' }),
      desc: desc.map((d, k) => new Mix(g, d, { size: 26, x: b.cx, y: b.y1 + 90 + 32 * k, anchor: 'middle', italic: true, color: 'dim' })) });
  };
  // 1 · sintetizar sonido: una onda cuadrada que se arma sumando armónicos impares
  item(0, 0, 'sintetizar sonido', ['sumando armónicos:', 'sintetizadores, autotune'], (pg, b) => {
    const c = new Curve(pg, null, { width: 3.5 });
    return p => {
      const K = 1 + 2 * Math.floor(lerp(0, 7, p));
      c.set(Array.from({ length: 241 }, (_, q) => q / 240).map(u => {
        let y = 0; for (let k = 1; k <= K; k += 2) y += Math.sin(2 * Math.PI * k * 2 * u) / k;
        return [lerp(b.x0, b.x1, u), b.cy - .5 * AL * y * 4 / Math.PI * .8];
      }));
    };
  });
  // 2 · reconocer canciones: la "constelación" de picos del espectrograma (Shazam)
  item(1, 0, 'reconocer canciones', ['Shazam: los picos del', 'espectrograma son la huella'], (pg, b) => {
    new Curve(pg, [[b.x0, b.y1], [b.x1, b.y1]], { color: 'ax', width: 2 }); new Curve(pg, [[b.x0, b.y1], [b.x0, b.y0]], { color: 'ax', width: 2 });
    new Tex(pg, 't', { size: 24, x: b.x1 + 14, y: b.y1 + 8, color: 'dim' }); new Tex(pg, 'f', { size: 24, x: b.x0 - 18, y: b.y0 + 14, color: 'dim' });
    const pts = Array.from({ length: 14 }, (_, q) => [lerp(b.x0 + 15, b.x1 - 10, (q + .5) / 14), lerp(b.y1 - 12, b.y0 + 12, r())]);
    let d = ''; for (let q = 0; q < pts.length - 2; q += 2) d += `M${pts[q][0]},${pts[q][1]}L${pts[q + 2][0]},${pts[q + 2][1]}`;
    const lin_ = E('path', { d, fill: 'none' }, pg); Object.assign(lin_.style, { stroke: C('h'), strokeWidth: 2 });
    const dots = pts.map(([x, y]) => { const c = E('circle', { cx: x, cy: y, r: 7 }, pg); c.style.fill = C('k'); return c; });
    return p => { dots.forEach((c, q) => c.style.opacity = clamp(p * 16 - q)); lin_.style.opacity = clamp(p * 2 - 1); };
  });
  // 3 · resonancia magnética: el resonador mide puntos del espacio k; con pocos, se arma la imagen (acá, Tilo)
  item(2, 0, 'resonancia magnética', ['mide en el espacio $k$: con', 'menos muestras, más rápido'], (pg, b) => {
    const dots = [];
    for (let j = 0; j < 8; j++) for (let l = 0; l < 8; l++) {
      const c = E('circle', { cx: b.x0 + 12 + l * 17, cy: b.y0 + 15 + j * 17, r: 4.5 }, pg);
      const medido = r() < .35 || (Math.abs(j - 3.5) < 1.5 && Math.abs(l - 3.5) < 1.5);
      c.style.fill = C(medido ? 'k' : 'tenue'); dots.push([c, medido]);
    }
    new Arrow(pg, b.x0 + 150, b.cy, b.x0 + 180, b.cy, { width: 3, head: 12 });
    if (FOTO) new Cuadro(pg, URLS.gris(FOTO.u, FOTO.n), { cx: b.x1 - 55, cy: b.cy, lado: 110 });
    return p => dots.forEach(([c, med], q) => c.style.opacity = med ? clamp(p * 3 - q / 64) : .7);
  });
  // 4 · fotografiar un agujero negro: los radiotelescopios miden la transformada de Fourier del cielo
  item(3, 0, 'fotografiar un agujero negro', ['los radiotelescopios', 'miden $\\hat u$ del cielo'], (pg, b) => {
    const id = 'anillo' + Math.random().toString(36).slice(2, 7), gr = E('radialGradient', { id }, pg);
    [[0, '#000000', 0], [.42, '#000000', 0], [.62, '#ff8a3d', 1], [.72, '#ffd2a8', 1], [.86, '#c4420a', .8], [1, '#000000', 0]].forEach(([o, c, a]) => E('stop', { offset: o, 'stop-color': c, 'stop-opacity': a }, gr));
    E('rect', { x: b.cx - 75, y: b.y0, width: 150, height: 150, rx: 8, fill: '#000000' }, pg);
    E('circle', { cx: b.cx, cy: b.cy, r: 66, fill: `url(#${id})` }, pg);
  });
  // 5 · operadores neuronales de Fourier: la receta, con el H que aprende una red
  item(0, 1, 'operadores neuronales', ['la receta, con un $H$', 'que aprende una red'], (pg, b) => {
    new Tex(pg, '\\class{cx}{v} \\xrightarrow{\\;\\F\\;} \\class{ck}{\\hat v} \\xrightarrow{\\class{ch}{\\times R_\\theta}} \\xrightarrow{\\;\\F^{-1}}\\class{cx}{v\'}', { size: 40, x: b.cx, y: b.cy + 14, anchor: 'middle' });
  });
  // 6 · resolver EDPs: el calor se difunde (lo vemos en G3)
  item(1, 1, 'resolver EDPs (en G3)', ['en Fourier, derivar es', 'multiplicar por $ik$'], (pg, b) => {
    new Curve(pg, [[b.x0, b.y1], [b.x1, b.y1]], { color: 'ax', width: 2 });
    const cs = [0, 1, 2, 3].map(q => new Curve(pg, Array.from({ length: 121 }, (_, i) => i / 120).map(u => {
      const s2 = .004 + q * .012; return [lerp(b.x0, b.x1, u), b.y1 - AL * .9 * Math.sqrt(.004 / s2) * Math.exp(-((u - .5) ** 2) / (2 * s2))];
    }), { width: 3.5 }));
    return p => cs.forEach((c, q) => c.alpha(clamp(p * 4 - q) * (1 - .2 * q)));
  });
  // 7 · multiplicar números gigantes: multiplicar es convolucionar los dígitos
  item(2, 1, 'multiplicar números gigantes', ['es convolucionar los dígitos:', 'así se calculan récords de $\\pi$'], (pg, b) => {
    new Tex(pg, '123 \\times 456 = 56.088', { size: 38, x: b.cx, y: b.cy - 18, anchor: 'middle' });
    new Tex(pg, '(1,2,3) \\ast (4,5,6) = (4,13,28,27,18)', { size: 26, x: b.cx, y: b.cy + 44, anchor: 'middle', color: 'h' });
  });
  // 8 · series de tiempo: una periodicidad escondida en el ruido aparece como un pico
  item(3, 1, 'series de tiempo', ['periodicidades escondidas,', 'estacionalidad'], (pg, b) => {
    const N = 128, serie = Array.from({ length: N }, (_, n) => Math.sin(2 * Math.PI * n / 8) * .7 + gauss(r) * .4);
    new Curve(pg, serie.map((v, n) => [lerp(b.x0, b.x0 + 170, n / (N - 1)), b.cy - 28 * v]), { width: 2 });
    const m_ = modDFT(serie), mx = Math.max(...m_.slice(1));
    const st = new Stems(pg, b.y1, { r: 0, width: 3 });
    new Curve(pg, [[b.x0 + 190, b.y1], [b.x1, b.y1]], { color: 'ax', width: 2 });
    const tops = m_.slice(1, 65).map((v, k) => [lerp(b.x0 + 196, b.x1 - 4, k / 63), b.y1 - (AL - 10) * v / mx]);
    return p => st.set(tops, p);
  });
  const cierre = new Mix(g, 'la FFT está en la lista de los 10 algoritmos más importantes del siglo XX', { size: 40, x: 960, y: 980, anchor: 'middle' });
  const cierre2 = new Txt(g, '(J. Dongarra y F. Sullivan, Computing in Science & Engineering, 2000)', { size: 26, x: 960, y: 1030, anchor: 'middle', italic: true, color: 'dim' });
  return {
    steps: [2.6, 2.6, 1.8],
    render(t) {
      titulo.write(P(t, 0, .8)); sub.write(P(t, .3, .8));
      items.forEach((it, q) => {
        const a = (q < 4 ? .5 : 2.6) + (q % 4) * .45, p = P(t, a, .5);
        it.m.alpha(p); it.anima(lin(t, a, 1.6), t);
        it.nombre.write(P(t, a + .2, .5)); it.desc.forEach((d, k) => d.write(P(t, a + .4 + .15 * k, .6)));
      });
      cierre.write(P(t, 5.3, 1.0)); cierre2.write(P(t, 5.9, .6));
    },
  };
});

/* ════════════════════════════════════════════════════════════════════════════
   Navegación
   ════════════════════════════════════════════════════════════════════════════ */
let SL = [], cur = 0, step = 0, anim = null;
const hud = document.getElementById('hud');
function mostrar(i) { SL.forEach((s, j) => s.g.style.display = j === i ? '' : 'none'); hud.textContent = `${i + 1} / ${SL.length}`; }
function pintar(i, t) { SL[i].render(t); }
function tocar(i, k) {
  SL[i].reset?.();
  const b = SL[i].b; anim = { i, from: b[k], to: b[k + 1], t0: performance.now() };
  const a = SL[i].audio?.[k]; if (a) sonar(a);
}
function hash() { history.replaceState(null, '', `#${cur + 1}.${step}`); }
function siguiente() {
  if (anim) { pintar(anim.i, anim.to); anim = null; return; }
  const s = SL[cur];
  if (step < s.steps.length - 1) { step++; tocar(cur, step); }
  else if (cur < SL.length - 1) { callar(); cur++; step = 0; mostrar(cur); pintar(cur, 0); tocar(cur, 0); }
  hash();
}
function anterior() {
  anim = null; callar();
  if (step > 0) step--;
  else if (cur > 0) { cur--; step = SL[cur].steps.length - 1; mostrar(cur); }
  SL[cur].reset?.(); pintar(cur, SL[cur].b[step + 1]); hash();
}
function ir(i, k) { anim = null; callar(); cur = clamp(i, 0, SL.length - 1); step = clamp(k, 0, SL[cur].steps.length - 1); mostrar(cur); SL[cur].reset?.(); pintar(cur, SL[cur].b[step + 1]); hash(); }
// Menú de slides con miniaturas (estado final de cada una). Se arma la primera vez que se abre.
const menu = document.getElementById('menu'), grilla = document.getElementById('grilla');
const TITULOS = {
  titulo: 'Título', 'dos-mundos': 'Dos mundos', receta: 'La receta', derivar: 'Derivar', umbral: 'Filtrar por umbral',
  'por-que': '¿Por qué anda?', parentesis: 'Paréntesis', espectrograma: 'Espectrograma', incertidumbre: '¿Ventana corta o larga?', ballena: 'Ballenas',
  fft: '¿Cuánto cuesta?', matriz: 'Una imagen es una matriz', 'ondas-2d': 'Puntos del espectro 2D', convolucion: 'Convolucionar a mano', 'fourier-2d': 'Fourier en 2D', 'mas-aplicaciones': 'Y hay mucho más', 'filtrar-imagenes': 'Filtrar en frecuencias', color: '¿Y a color?',
  comprimir: 'Comprimir', babel: '¿Por qué se puede comprimir?', sintesis: 'Síntesis',
};
let miniaturas = null;
function armarMiniaturas() {
  miniaturas = SL.map((s, i) => {
    s.render(s.b.at(-1));
    const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 0 1920 1080');
    const copia = s.g.cloneNode(true); copia.style.display = '';
    copia.querySelectorAll('[id]').forEach(el => {   // ids únicos (clipPath, gradientes) para no pisar a los originales
      const viejo = el.id; el.id = `${viejo}-m${i}`;
      for (const at of ['clip-path', 'fill']) copia.querySelectorAll(`[${at}="url(#${viejo})"]`).forEach(r => r.setAttribute(at, `url(#${el.id})`));
    });
    svg.appendChild(copia);
    const d = document.createElement('div'), rot = document.createElement('div');
    d.className = 'mini'; rot.textContent = `${i + 1}  ·  ${TITULOS[s.nombre] ?? s.nombre}`;
    d.append(svg, rot);
    d.addEventListener('click', e => { e.stopPropagation(); cerrarMenu(); ir(i, 0); });
    grilla.appendChild(d);
    return d;
  });
  pintar(cur, SL[cur].b[step + 1]);
}
function abrirMenu() {
  if (anim) { pintar(anim.i, anim.to); anim = null; }
  if (!miniaturas) armarMiniaturas();
  miniaturas.forEach((d, i) => d.classList.toggle('actual', i === cur));
  menu.hidden = false; miniaturas[cur].scrollIntoView({ block: 'nearest' });
}
function cerrarMenu() { menu.hidden = true; }
hud.addEventListener('click', e => { e.stopPropagation(); menu.hidden ? abrirMenu() : cerrarMenu(); });

function bucle(now) {
  // el parlante del audio que está sonando se pinta de verde
  for (const p of PARLANTES) {
    const n = typeof p.nombre === 'function' ? p.nombre() : p.nombre;
    p.g.style.setProperty('--parl', sonando && !sonando.paused && sonando === AUD[n] ? 'var(--h)' : 'var(--dim)');
  }
  CABEZALES.forEach(c => c.actualizar());
  if (anim) { const t = anim.from + (now - anim.t0) / 1000; if (t >= anim.to) { pintar(anim.i, anim.to); anim = null; } else pintar(anim.i, t); }
  requestAnimationFrame(bucle);
}
addEventListener('keydown', e => {
  if (['ArrowRight', 'ArrowDown', ' ', 'PageDown', 'Enter'].includes(e.key)) { e.preventDefault(); siguiente(); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); anterior(); }
  else if (e.key === 'Home') ir(0, 0);
  else if (e.key === 'End') ir(SL.length - 1, 99);
  else if (e.key === 'Escape') { callar(); cerrarMenu(); }
  else if (e.key === 'm' || e.key === 'M') menu.hidden ? abrirMenu() : cerrarMenu();
  else if (e.key === 't' || e.key === 'T') { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('tema', r.dataset.theme); } catch (_) {} }
  else if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
// Un click que empezó en un control (slider, botón, punto arrastrable) no pasa de slide, aunque se suelte en otro lado:
// los controles cortan la propagación del pointerdown, así que sólo los clicks "de fondo" llegan a stage.
let desdeControl = false;
addEventListener('pointerdown', () => desdeControl = true, true);
stage.addEventListener('pointerdown', () => desdeControl = false);
stage.addEventListener('click', () => {
  if (desdeControl || trasDeslizar) { desdeControl = trasDeslizar = false; return; }
  menu.hidden ? siguiente() : cerrarMenu();
});
// En el celular, además de tocar: deslizar a la izquierda avanza y a la derecha retrocede. El pointerdown llega
// antes que el touchstart, así que un gesto que empieza en un control (desdeControl) no cuenta.
let toque = null, trasDeslizar = false;
stage.addEventListener('touchstart', e => {
  trasDeslizar = false;
  toque = e.touches.length === 1 && !desdeControl && menu.hidden ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
}, { passive: true });
stage.addEventListener('touchend', e => {
  if (!toque) return;
  const dx = e.changedTouches[0].clientX - toque.x, dy = e.changedTouches[0].clientY - toque.y; toque = null;
  if (Math.abs(dx) < 50 || Math.abs(dx) < 1.5 * Math.abs(dy)) return;
  trasDeslizar = true;   // por si el navegador igual dispara el click del toque
  dx < 0 ? siguiente() : anterior();
});

// Para capturas automáticas: renderiza la slide i en el paso k, a una fracción del tramo.
window.__goto = (i, k, frac = 1) => { window.__exportando = true; anim = null; cur = i; step = k; mostrar(i); const b = SL[i].b; pintar(i, lerp(b[k], b[k + 1], frac)); };

(async () => {
  try { const tm = localStorage.getItem('tema'); if (tm) document.documentElement.dataset.theme = tm; } catch (_) {}
  await MathJax.startup.promise;
  await Promise.all(['40px CMU', 'italic 40px CMU', 'bold 40px CMU'].map(f => document.fonts.load(f)));
  SL = DEF.map(d => {
    const g = E('g', { 'data-slide': d.nombre }, stage);
    const s = d.build(g); s.g = g; s.nombre = d.nombre;
    s.b = [0]; s.steps.forEach(v => s.b.push(s.b.at(-1) + v));
    return s;
  });
  window.__slides = SL.map(s => ({ nombre: s.nombre, pasos: s.steps.length }));
  document.getElementById('cargando').remove();
  const m = location.hash.match(/#(\d+)\.(\d+)/);
  if (m) ir(+m[1] - 1, +m[2]); else { mostrar(0); pintar(0, 0); tocar(0, 0); }
  window.__ready = true;
  requestAnimationFrame(bucle);
})();
</script>
